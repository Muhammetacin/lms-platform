name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, database checks, typecheck, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lms_platform_test
          POSTGRES_USER: lms_app
          POSTGRES_PASSWORD: lms_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_app -d lms_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://lms_app:lms_test_password@localhost:5432/lms_platform_test?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply migrations to PostgreSQL test database
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://lms_app:lms_test_password@localhost:5432/lms_platform_test?schema=public

      - name: Database configuration tests
        run: pnpm test:db-config

      - name: Authentication tests
        run: pnpm test:auth

      - name: Authorization tests
        run: pnpm test:authorization

      - name: Tenant context tests
        run: pnpm test:tenant-context

      - name: Organization settings tests
        run: pnpm test:organization-settings

      - name: Employee management tests
        run: pnpm test:employee-management

      - name: Employee profile tests
        run: pnpm test:employee-profile

      - name: Employee invitation tests
        run: pnpm test:employee-invitation

      - name: Team tests
        run: pnpm test:team

      - name: PostgreSQL employee invitation tests
        run: pnpm test:employee-invitation:db

      - name: PostgreSQL team tests
        run: pnpm test:team:db

      - name: PostgreSQL tenant isolation tests
        run: pnpm test:tenant-isolation:db

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
